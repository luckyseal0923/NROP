<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>【NROP 護理即時動態平台】重設密碼通知</title>
</head>
<body style="margin:0;padding:0;background:#edf3fa;color:#162b41;font-family:'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif;">
  <table role="presentation" style="width:100%;border-collapse:collapse;">
    <tr>
      <td align="center" style="padding:24px 16px;">
        <table role="presentation" style="width:100%;max-width:600px;border-collapse:separate;border-spacing:0;background:#ffffff;border:1px solid #c8d9ea;border-radius:12px;">
          <tr>
            <td style="padding:24px 28px;background:#062752;color:#ffffff;border-radius:11px 11px 0 0;font-size:20px;font-weight:700;line-height:1.5;">護理即時動態平台 NROP</td>
          </tr>
          <tr>
            <td style="padding:28px;font-size:16px;line-height:1.8;">
              <p style="margin:0 0 18px;">您好：</p>
              <p style="margin:0 0 18px;">我們收到您在「護理即時動態平台 NROP」提出的密碼重設申請。</p>
              <p style="margin:0 0 18px;">請點選下方按鈕，設定新的登入密碼：</p>
              <p style="margin:24px 0 28px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 24px;border-radius:8px;background:#0061bf;color:#ffffff;text-decoration:none;font-weight:700;">設定新密碼</a>
              </p>
              <p style="margin:0 0 18px;">若連結已失效，請回到平台重新點選「忘記密碼」，並使用最新收到的信件。</p>
              <p style="margin:0 0 18px;">若您未提出此申請，請忽略本信件。</p>
              <p style="margin:0 0 24px;">如需協助，請聯絡護理部。</p>
              <p style="margin:0;">護理即時動態平台 NROP</p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px;border-top:1px solid #c8d9ea;color:#51677e;font-size:13px;line-height:1.8;">本信件僅供系統通知使用，請勿直接回覆。</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
